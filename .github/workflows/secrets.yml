name: Scan Git history for secrets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private working files
        run: python scripts/check_publication.py
      - name: Verify scanner and scan with redacted output
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          cd "$scanner_dir"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --location --silent --show-error "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o scanner.tar.gz
          curl --fail --location --silent --show-error "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  scanner.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf scanner.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scanner_dir/gitleaks" git --redact=100 --no-banner --log-opts=--all .
