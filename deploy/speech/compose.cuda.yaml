# CUDA overlay for a fresh server. No pre-existing containers, volumes or networks.
# Run with compose.yaml and the private speech.env described in the README.
services:
  stt:
    build:
      dockerfile: Dockerfile.pascal
    image: bentebot-whisperlivekit:cuda-local
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      WLK_COMPUTE_TYPE: "${STT_CUDA_COMPUTE_TYPE:-int8_float32}"
  tts:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.6.3@sha256:c0da392c37e76a01ba479239b43124c67baf8913ae0f491071d6ac544641dad7
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      UNSTABLE_ORT_OPTS__EXCLUDE_PROVIDERS: '["TensorrtExecutionProvider"]'
      UNSTABLE_ORT_OPTS__PROVIDER_PRIORITY: '{"CUDAExecutionProvider":100}'
      UNSTABLE_ORT_OPTS__PROVIDER_OPTS: '{"CUDAExecutionProvider":{"cudnn_conv_algo_search":"DEFAULT"}}'
