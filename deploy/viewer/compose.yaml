name: bentebot-viewer
services:
  viewer:
    build:
      context: ../..
      dockerfile: deploy/viewer/Dockerfile
    image: bentebot-viewer:local
    init: true
    restart: "on-failure:3"
    environment:
      VIEWER_BOT_URL: http://bentebot:8080
      VIEWER_USER_ID: ${BENTEBOT_NATIVE_VIEWER_ID:?Set an authorized viewer account ID}
      VIEWER_DISCORD_TOKEN_FILE: /run/secrets/discord_token
      VIEWER_CONTROL_KEY_FILE: /run/secrets/viewer_control_key
    secrets:
      - discord_token
      - viewer_control_key
    networks:
      - bot
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: 1g
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
secrets:
  discord_token:
    file: ${BENTEBOT_VIEWER_SECRETS_DIR:?Set an absolute private secrets directory}/discord-token
  viewer_control_key:
    file: ${BENTEBOT_VIEWER_SECRETS_DIR:?Set an absolute private secrets directory}/control-key
networks:
  bot:
    external: true
    name: bentebot_default
