# Persisted project configuration, read-only inside the container.
# No API key is needed. start.sh generates an ephemeral session-signing secret.
use_default_settings: true
general:
  debug: false
  instance_name: Bentebot private search
search:
  formats: [json]
  autocomplete: ""
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
valkey:
  url: false
