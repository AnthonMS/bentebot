services:
  bentebot:
    build: .
    image: bentebot:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BENTEBOT_DATABASE_PATH: /app/data/bentebot.sqlite3
      BENTEBOT_HEALTH_PORT: "8080"
    volumes:
      - bentebot-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No inbound ports are needed: Discord and inference connections are outbound.
    # For Unraid local appdata, replace the named volume with:
    # - /mnt/user/appdata/bentebot/data:/app/data
    # Ensure this directory is writable by container UID 99 / GID 100 first.
    # Never use an SMB/NFS-mounted SQLite database.

volumes:
  bentebot-data:
