[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bentebot"
version = "0.3.3"
description = "An API-only Discord text and streaming voice companion"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["bentebot", "bentebot.*"]

[tool.setuptools.package-data]
bentebot = ["screen_assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 110
include = ["bentebot/**/*.py", "bentebot_viewer/**/*.py", "bentebot_audio_worker/**/*.py", "tests/**/*.py", "scripts/**/*.py", "deploy/speech/**/*.py", "deploy/web-tools/**/*.py", "deploy/audio/**/*.py", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
